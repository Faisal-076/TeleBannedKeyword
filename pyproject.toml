[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-message-analyzer"
version = "0.1.0"
description = "Production-grade Telegram message analysis bot: rule engine, history evidence, risk scoring, optional LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "aiogram>=3.30,<4",
    "telethon>=1.44,<2",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5,<6",
    "arq>=0.26,<0.27",
    "httpx>=0.27,<1",
    "cryptography>=43,<46",
    "rapidfuzz>=3.9,<4",
    "regex>=2024.11.6",
    "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "aiosqlite>=0.20,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
tbk-bot = "app.main:run_bot"
tbk-worker = "app.main:run_worker"
tbk-api = "app.main:run_api"
tbk-auth = "scripts.auth_session:main"
tbk-encrypt = "scripts.encrypt_value:main"
tbk-import-rules = "scripts.import_rules:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=3"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false

# Railway deployment definition (two services, same image).
# Postgres and Redis: add via Railway dashboard plugins, then set
# DATABASE_URL / REDIS_URL as shared variables.
#
# MTProto ownership: ONLY the worker opens the scanner session, so ONLY the
# worker mounts the /data volume (SESSION_FILE=/data/session.enc). The bot
# service never touches the session file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.bot]
command = "python -m app.main bot"

[services.worker]
command = "python -m app.main worker"
[[services.worker.volumes]]
mountPath = "/data"
name = "session-data-worker"
